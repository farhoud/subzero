# @sigil implements design/sigil-wiring.sigil SigilWiring (interpreter agent definitions)
#
# Copied into each pass directory as .agents/subzero.yaml. Skill folders resolve
# against this file's directory, so ../skills/ is the pass directory's staged
# sigil skills, never the sigil repository itself.
skills:
  sigil-understand: ../skills/sigil-understand
  sigil-egglog: ../skills/sigil-egglog

endpoints:
  # One local GPU serves one request at a time. The limit holds only among the
  # child runs of one process.
  r9700:
    parallel: 1

# What runs a child lives here and never in an agent: host, model and thinking.
models:
  tiers:
    medium:
      host: pi
      model: r9700/Qwen3.8
      thinking: high
    low:
      host: pi
      model: r9700/Qwen3.8
      thinking: low
    control:
      # Must be the Claude model that the interpreters of arm A use, which is the
      # evaluator's model. Requires pi to be logged into Anthropic.
      host: pi
      model: anthropic/claude-sonnet-5-5
      thinking: high

agents:
  general:
    tools: [read, bash, edit, write, grep, find, ls]
    timeout: 1800
  fallback:
    tools: [read, grep, find, ls]
    timeout: 1800
  sigil-interpreter:
    description: Reads one prepared sigilc request and writes its claim rows to the answer file the brief names.
    skills: [sigil-understand, sigil-egglog]
    # Drop grep and find here if they fail under pi's offline mode.
    tools: [read, grep, find, ls, write]
    timeout: 1800

  sigil-interpreter-low:
    description: sigil-interpreter at the thinking level low, for experiment arm B-low.
    tier: low
    skills: [sigil-understand, sigil-egglog]
    tools: [read, grep, find, ls, write]
    timeout: 1800

  sigil-interpreter-control:
    description: sigil-interpreter on the Claude model of arm A's interpreters, for experiment arm B-control.
    tier: control
    skills: [sigil-understand, sigil-egglog]
    tools: [read, grep, find, ls, write]
    timeout: 1800
