# subzero agents for the demo. Skill folders resolve against this file's directory.
skills:
  code-review: ../pi-skills/code-review

endpoints:
  # One local GPU serves one request at a time.
  r9700:
    parallel: 1

# What runs a child lives here and never in an agent: host, model and thinking.
models:
  tiers:
    default:
      host: pi
      model: r9700/Qwen3.8
      thinking: low
    # CE's "mid-tier" dispatches (tiered-subagent-routing) run on this tier.
    medium:
      host: pi
      model: r9700/Qwen3.8
      thinking: medium

agents:
  # Take unnamed and tiered work, such as CE's generic subagents. No description:
  # they are never chosen by description. Full tools: CE reviewers write findings
  # files and run read-only git, and pi has no path sandbox (run from a demo copy).
  general:
    tools: [read, bash, edit, write, grep, find, ls]
    timeout: 1200
  # Runs a delegation that names an agent this file does not hold; read-only.
  fallback:
    tools: [read, grep, find, ls]
    timeout: 1200

  reviewer:
    description: Reviews one source file for bugs and replies with the findings, one line each.
    tier: default
    skills: [code-review]
    tools: [read, grep, find, ls]
    timeout: 600
